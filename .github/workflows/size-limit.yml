name: "Size Limit"

on:
  pull_request:
    types: [synchronize, opened]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  size-limit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "^22.22.1"
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # The action checks out main after measuring the PR. Keep the same named
      # checks for both revisions, including when main still has unnamed checks.
      - name: Preserve comparison configuration
        run: cp .size-limit.json .size-limit-ci.json
      - name: size-limit
        uses: andresz1/size-limit-action@v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: --filter client build
          script: bunx size-limit --json --config .size-limit-ci.json
          package_manager: bun
